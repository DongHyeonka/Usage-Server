spring:
  r2dbc:
    url: r2dbc:postgresql://${dev-db.postgres.host}:${dev-db.postgres.port}/${dev-db.postgres.name}
    username: ${dev-db.postgres.username}
    password: ${dev-db.postgres.password}
  kafka:
    bootstrap-servers: ${dev-kafka.bootstrap-servers:localhost:9092}
    consumer:
      group-id: usage-server-dev
    producer:
      client-id: usage-server-dev
      
management:
  prometheus:
    metrics:
      export:
        step: 30s
