plugins {
	id 'java-library'
	id 'maven-publish'
}

dependencies {
	
}

publishing {
	publications {
		mavenJava(MavenPublication) {
            artifactId = 'usage-service-api'
            from components.java
        }
	}
	repositories {
        maven {
            name = "GithubPackages"
            url = "https://maven.pkg.github.com/DongHyeonka/Usage-Server"
            credentials {
                username = providers.gradleProperty("GITHUB_USERNAME").getOrNull()
                password = providers.gradleProperty("GITHUB_TOKEN").getOrNull()
            }
        }
    }
}
